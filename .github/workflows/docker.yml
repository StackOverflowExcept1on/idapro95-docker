name: Docker

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [ cli, x11 ]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm64,linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download binaries
        run: |
          curl -sL -o ida-pro_94_armlinux.run "${{ secrets.IDA_PRO_ARM_LINUX_URL }}"
          curl -sL -o ida-pro_94_x64linux.run "${{ secrets.IDA_PRO_X64_LINUX_URL }}"

          sha256sum ida-pro_94_armlinux.run
          sha256sum ida-pro_94_x64linux.run

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          build-args: MODE=${{ matrix.mode }}
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:9.4-${{ matrix.mode }}
